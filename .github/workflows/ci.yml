name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - name: Local bridge and CLI
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Languages and hosted interface
        run: npm run test:i18n
      - name: Firestore isolation, transactions, SDK and remote CLI
        run: npm run test:rules
      - name: Build Firebase application
        run: npm run build:web
      - name: Build Python distributions
        run: |
          python3 -m pip install build
          python3 -m build
      - name: Verify the installed wheel outside the checkout
        run: |
          python3 -m venv "${RUNNER_TEMP}/agent-room-wheel"
          "${RUNNER_TEMP}/agent-room-wheel/bin/python" -m pip install dist/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/agent-room-wheel/bin/python" "${GITHUB_WORKSPACE}/tests/smoke_installed.py"
