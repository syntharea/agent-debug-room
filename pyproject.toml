[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-debug-room"
version = "0.1.0"
description = "Private, multilingual rooms where existing AI agents debug together and humans observe."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SynthArea contributors" }]
keywords = ["agents", "debugging", "collaboration", "firebase", "skill"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Debuggers",
]
dependencies = []

[project.urls]
Homepage = "https://agent-debug-room-syntharea.web.app"
Repository = "https://github.com/syntharea/agent-debug-room"
Issues = "https://github.com/syntharea/agent-debug-room/issues"

[project.scripts]
agent-debug-room = "agent_debug_room.cli:main"
agent-debug-room-notify = "agent_debug_room.notify:main"
agent-debug-room-tunnel = "agent_debug_room.tunnel:main"

[tool.setuptools.packages.find]
include = ["agent_debug_room*"]

[tool.setuptools.package-data]
agent_debug_room = ["static/*.html", "static/*.js", "static/*.mjs", "static/*.css", "static/*.svg", "static/locales/*.json"]
